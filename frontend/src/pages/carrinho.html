
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AstroShop | Carrinho</title>

    <link rel="stylesheet" href="../style.css">
</head>

<body>

    <!-- CABEÇALHO -->
    <header class="site-header">
        <nav class="navbar container">

            <a class="logo" href="home.html">
                ✦ AstroShop
            </a>

            <div class="nav-links">
                <a href="./home.html">Início</a>
                <a href="./produtos.html">Produtos</a>
                <a href="./carrinho.html">Carrinho</a>
                <a href="./compras.html">Minhas compras</a>
            </div>

        </nav>
    </header>

    <!-- CONTEÚDO PRINCIPAL -->
    <main class="container secao">

        <h1 class="titulo-secao">
            Seu carrinho
        </h1>

        <p class="texto-secundario">
            Confira os itens antes de finalizar o pedido.
        </p>

        <!-- MENSAGENS DO CARRINHO -->
        <p
            id="mensagem-carrinho"
            class="mensagem"
            aria-live="polite"
        ></p>

        <!-- LISTA DE PRODUTOS -->
        <section
            id="itens-carrinho"
            class="lista-itens"
        >
            <p>Carregando carrinho...</p>
        </section>

        <!-- RESUMO DO PEDIDO -->
        <section class="painel">

            <p>Total do pedido</p>

            <p
                id="total-carrinho"
                class="total"
            >
                R$ 0,00
            </p>

            <div class="hero-acoes">

                <button
                    id="finalizar-compra"
                    class="botao"
                    type="button"
                >
                    Finalizar compra
                </button>

                <button
                    id="limpar-carrinho"
                    class="botao botao-perigo"
                    type="button"
                >
                    Esvaziar carrinho
                </button>

                <a
                    class="botao botao-secundario"
                    href="produtos.html"
                >
                    Continuar comprando
                </a>

            </div>

        </section>

    </main>

    <!-- JANELA DE ESCOLHA DO PAGAMENTO -->
    <section
        id="modal-pagamento"
        class="pagamento-modal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="titulo-pagamento"
        hidden
    >

        <div class="pagamento-conteudo">

            <h2 id="titulo-pagamento">
                Forma de pagamento
            </h2>

            <p class="texto-secundario">
                Escolha como deseja pagar seu pedido:
            </p>

            <form id="form-pagamento">

                <!-- PIX -->
                <label class="opcao-pagamento">

                    <input
                        type="radio"
                        name="metodo_pagamento"
                        value="pix"
                        checked
                    >

                    <span>
                        <strong>Pix</strong>
                        <small>(Simulado)</small>
                    </span>

                </label>

                <!-- CARTÃO -->
                <label class="opcao-pagamento">

                    <input
                        type="radio"
                        name="metodo_pagamento"
                        value="cartao"
                    >

                    <span>
                        <strong>Cartão</strong>
                        <small>(Simulado)</small>
                    </span>

                </label>

                <!-- BOLETO -->
                <label class="opcao-pagamento">

                    <input
                        type="radio"
                        name="metodo_pagamento"
                        value="boleto"
                    >

                    <span>
                        <strong>Boleto</strong>
                        <small>(Simulado)</small>
                    </span>

                </label>

                <!-- MENSAGEM DO PAGAMENTO -->
                <p
                    id="mensagem-pagamento"
                    class="mensagem"
                    aria-live="polite"
                ></p>

                <!-- BOTÕES -->
                <div class="acoes-pagamento">

                    <button
                        id="confirmar-pagamento"
                        class="botao"
                        type="submit"
                    >
                        Confirmar compra
                    </button>

                    <button
                        id="cancelar-pagamento"
                        class="botao botao-secundario"
                        type="button"
                    >
                        Voltar ao carrinho
                    </button>

                </div>

            </form>

        </div>

    </section>

    <!-- RODAPÉ -->
    <footer class="rodape">
        © 2026 AstroShop
    </footer>

    <!-- JAVASCRIPT -->
    <script src="../index.js"></script>
    <script src="../pages/carrinho.js"></script>

</body>
</html>
