
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AstroShop | Minhas compras</title>
    <link rel="stylesheet" href="../style.css">
</head>

<body>

    <header class="site-header">
        <nav class="navbar container">
            <a class="logo" href="home.html">✦ AstroShop</a>

            <div class="nav-links">
                <a href="home.html">Início</a>
                <a href="produtos.html">Produtos</a>
                <a href="carrinho.html">Carrinho</a>
                <a href="compras.html" class="link-ativo">Minhas compras</a>
            </div>
        </nav>
    </header>

    <main class="container secao pagina-compras">

        <section class="cabecalho-compras">
            <div>
                <h1 class="titulo-secao">Minhas compras</h1>
                <p class="texto-secundario">
                    Acompanhe seus pedidos e consulte os produtos comprados.
                </p>
            </div>

            <a href="produtos.html" class="botao botao-secundario">
                Continuar comprando
            </a>
        </section>

        <p
            id="mensagem-compras"
            class="mensagem"
            aria-live="polite"
        ></p>

        <section id="lista-compras" class="lista-compras">
            <div class="estado-compras">
                <p>Carregando suas compras...</p>
            </div>
        </section>

    </main>

    <footer class="rodape">
        © 2026 AstroShop
    </footer>

    <script src="../index.js"></script>
    <script src="../pages/compras.js"></script>

</body>
</html>
