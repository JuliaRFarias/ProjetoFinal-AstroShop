
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AstroShop | Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="pagina-formulario">
    <section class="card-formulario">
      <a class="logo" href="../../index.html">✦ AstroShop</a>
      <h1>Bem-vindo de volta!</h1>
      <p>Entre na sua conta para explorar o universo.</p>

      <form id="form-login" class="formulario">
        <div class="campo">
          <label for="email">E-mail</label>
          <input id="email" name="email" type="email"
            autocomplete="email" required>
        </div>

        <div class="campo">
          <label for="senha">Senha</label>
          <input id="senha" name="senha" type="password"
            autocomplete="current-password" required>
        </div>

        <button class="botao" type="submit">Entrar</button>
        <p id="mensagem-login" class="mensagem" aria-live="polite"></p>
      </form>

      <p>Não tem uma conta?
        <a class="link-formulario" href="./cadastro.html">Cadastre-se</a>
      </p>

      <a class="voltar" href="../pages/home.html">← Voltar à loja</a>
    </section>
  </main>

  <script src="../index.js"></script>
  <script src="./login.js"></script>
</body>
</html>
